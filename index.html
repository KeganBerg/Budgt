<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgt</title>
  <meta name="description" content="Budgt: a clean, simple budgeting app. Track spending, bills and debt, and see how you're doing on your savings goals.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#dashboard">
        <img src="assets/favicon.svg" alt="" width="28" height="28">
        <span>Budgt</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span>Dashboard</span></a>
        <a href="#transactions" data-view="transactions"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Transactions</span></a>
        <a href="#budget" data-view="budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg><span>Budget</span></a>
        <a href="#liabilities" data-view="liabilities"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Bills &amp; debt</span></a>
        <a href="#goals" data-view="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Goals</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="link-btn" id="exportBtn" type="button">Export backup</button>
        <label class="link-btn" for="importFile">Import backup</label>
        <input type="file" id="importFile" accept="application/json" hidden>
        <p class="fine save-status" id="saveStatus">Changes save automatically</p>
        <p class="fine">Your data stays in this browser. Nothing is uploaded.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Dashboard</h1>
        <div class="month-picker">
          <button type="button" class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button>
          <span id="monthLabel"></span>
          <button type="button" class="icon-btn" id="nextMonth" aria-label="Next month">›</button>
        </div>
        <button type="button" class="btn btn-ghost calc-toggle" id="calcToggle" aria-controls="calc" aria-expanded="false" title="Calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg><span>Calculator</span></button>
        <button type="button" class="btn" id="addTxnBtn">+ Add transaction</button>
      </header>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-transactions" hidden></section>
      <section class="view" id="view-budget" hidden></section>
      <section class="view" id="view-liabilities" hidden></section>
      <section class="view" id="view-goals" hidden></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm" novalidate>
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <span class="modal-tools">
          <button type="button" class="icon-btn calc-open" data-calc-open aria-label="Open calculator" title="Calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></button>
          <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
        </span>
      </header>
      <div id="modalBody"></div>
      <p class="form-note" id="modalNote"></p>
      <p class="form-error" id="modalError" role="alert"></p>
      <footer class="modal-foot">
        <button type="button" class="btn btn-danger-ghost" id="modalDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn" id="modalSave">Save</button>
      </footer>
    </form>
  </dialog>

  <aside class="calc" id="calc" aria-label="Calculator" hidden>
    <header class="calc-head">
      <h2>Calculator</h2>
      <span class="calc-head-tools">
        <button type="button" class="link-btn" id="calcClearTape">Clear history</button>
        <button type="button" class="icon-btn" id="calcClose" aria-label="Close calculator">✕</button>
      </span>
    </header>
    <ol class="calc-tape" id="calcTape" aria-label="History"></ol>
    <div class="calc-display">
      <input id="calcExpr" autocomplete="off" spellcheck="false" inputmode="none" aria-label="Expression" placeholder="0">
      <output id="calcResult" aria-live="polite"></output>
    </div>
    <div class="calc-keys" id="calcKeys">
      <button type="button" data-k="C" class="k-fn">C</button>
      <button type="button" data-k="(" class="k-fn">(</button>
      <button type="button" data-k=")" class="k-fn">)</button>
      <button type="button" data-k="/" class="k-op" aria-label="Divide">÷</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" data-k="*" class="k-op" aria-label="Multiply">×</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="-" class="k-op" aria-label="Minus">−</button>
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="+" class="k-op" aria-label="Plus">+</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k=".">.</button>
      <button type="button" data-k="back" class="k-fn" aria-label="Backspace">⌫</button>
      <button type="button" data-k="=" class="k-eq">=</button>
    </div>
    <button type="button" class="btn calc-insert" id="calcInsert" disabled>Click a money field to insert</button>
  </aside>

  <script src="assets/app.js"></script>
  <script src="assets/calc.js"></script>
</body>
</html>
